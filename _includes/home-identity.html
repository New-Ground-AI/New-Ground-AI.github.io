<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "@id": {{ '/#website' | absolute_url | jsonify }},
      "url": {{ '/' | absolute_url | jsonify }},
      "name": {{ site.title | jsonify }},
      "description": {{ page.description | jsonify }},
      "publisher": { "@id": {{ '/#organization' | absolute_url | jsonify }} }
    },
    {
      "@type": "Organization",
      "@id": {{ '/#organization' | absolute_url | jsonify }},
      "url": {{ '/' | absolute_url | jsonify }},
      "name": {{ site.title | jsonify }},
      "description": {{ page.description | jsonify }},
      "logo": {{ '/assets/images/brand/new-ground-ai.png' | absolute_url | jsonify }},
      "sameAs": [
        "https://github.com/New-Ground-AI",
        "https://huggingface.co/5a-community",
        "https://www.linkedin.com/company/new-ground-ai"
      ]
    }
  ]
}
</script>
