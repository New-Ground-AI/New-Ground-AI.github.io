title: New Ground AI
description: Advanced · Analytical · Adaptive · Adventurous · Aspiring
url: "https://new-ground-ai.github.io"
baseurl: ""
plugins:
  - jekyll-sitemap
lang: en
markdown: kramdown
kramdown:
  input: GFM

collections:
  projects:
    output: true
    permalink: /projects/:name/
  people:
    output: true
    permalink: /people/:name/

defaults:
  - scope:
      path: "assets/**/*.pdf"
    values:
      sitemap: false
  - scope:
      path: "google*.html"
    values:
      sitemap: false
  - scope:
      path: ""
      type: projects
    values:
      layout: ongoing-project
      nav: projects
  - scope:
      path: ""
      type: people
    values:
      layout: member
      nav: people

exclude:
  - brand-spec.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - node_modules
  - vendor
  - people/member-template
  - projects/project-template
  - _projects/ongoing-project-template.md
  - publication/project-template
  - scripts

